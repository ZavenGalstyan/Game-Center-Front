<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Doll viewer (dev only)</title>
    <style>
      html, body { margin: 0; height: 100%; background: #2a2328; overflow: hidden; }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <script type="module">
      // DEV-ONLY doll viewer:
      //   /src/components/games/DollRepairWorkshop/tools/viewer.html?types=porcelain,fashion&order=0&yaw=0&dist=3&cy=0.5
      //   ?order=10 shows that order's damaged doll; &look=hairStyle:braids,outfit:ballgown overrides the look.
      import * as THREE from "three";
      import { RoomEnvironment } from "three/examples/jsm/environments/RoomEnvironment.js";
      import { buildDoll } from "../render/dollModel.js";
      import { DEFAULT_LOOKS, DOLL_ORDER } from "../data/dolls.js";
      import { ORDER_BY_ID } from "../data/orders.js";
      const q = new URLSearchParams(location.search);
      const W = Number(q.get("w") || innerWidth), H = Number(q.get("h") || innerHeight);
      const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
      r.setSize(W, H);
      r.outputColorSpace = THREE.SRGBColorSpace;
      r.toneMapping = THREE.ACESFilmicToneMapping;
      r.toneMappingExposure = 1.05;
      r.shadowMap.enabled = true;
      r.shadowMap.type = THREE.PCFSoftShadowMap;
      document.body.appendChild(r.domElement);
      const scene = new THREE.Scene();
      scene.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture;
      scene.environmentIntensity = 0.55;
      scene.background = new THREE.Color("#e9d9cf");
      scene.add(new THREE.HemisphereLight("#fff4e8", "#7a5c4a", 0.9));
      const sun = new THREE.DirectionalLight("#fff1dc", 2.2);
      sun.position.set(2, 4, 3);
      sun.castShadow = true;
      sun.shadow.mapSize.set(2048, 2048);
      sun.shadow.camera.left = -3; sun.shadow.camera.right = 3; sun.shadow.camera.top = 3; sun.shadow.camera.bottom = -1;
      sun.shadow.bias = -0.0004;
      scene.add(sun);
      const fill = new THREE.DirectionalLight("#ffd9e8", 0.6);
      fill.position.set(-3, 2, 2);
      scene.add(fill);
      const ground = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.MeshStandardMaterial({ color: "#c9b4a3", roughness: 0.9 }));
      ground.rotation.x = -Math.PI / 2;
      ground.receiveShadow = true;
      scene.add(ground);
      const cam = new THREE.PerspectiveCamera(Number(q.get("fov") || 30), W / H, 0.01, 100);
      const order = q.get("order") ? ORDER_BY_ID[Number(q.get("order"))] : null;
      const types = order ? [order.type] : (q.get("types") || DOLL_ORDER.join(",")).split(",");
      const over = {};
      for (const kv of (q.get("look") || "").split(",").filter(Boolean)) { const [k, v] = kv.split(":"); over[k] = v; }
      const gap = Number(q.get("gap") || 0.55);
      const models = [];
      types.forEach((t, k) => {
        const m = buildDoll({ type: t, look: { ...(order ? order.look : DEFAULT_LOOKS[t]), ...over }, damage: order ? order.damage : [], seed: order ? order.id * 101 : 3 });
        m.root.position.x = (k - (types.length - 1) / 2) * gap;
        m.root.rotation.y = Number(q.get("turn") || 0);
        scene.add(m.root);
        models.push(m);
      });
      window.__models = models;
      const yaw = Number(q.get("yaw") || 0);
      const dist = Number(q.get("dist") || 1.2 + types.length * 0.55);
      const cy = Number(q.get("cy") || 0.5);
      cam.position.set(Math.sin(yaw) * dist + Number(q.get("cx") || 0), cy + Number(q.get("up") || 0.15), Math.cos(yaw) * dist);
      cam.lookAt(Number(q.get("cx") || 0), cy, 0);
      r.render(scene, cam);
      window.__render = () => r.render(scene, cam);
      window.__cam = cam;
      window.__ready = true;
    </script>
  </body>
</html>
