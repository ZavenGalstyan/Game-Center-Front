<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Hulk model viewer (dev only)</title>
    <style>
      html, body { margin: 0; height: 100%; background: #20252b; overflow: hidden; }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <script type="module">
      // DEV-ONLY character viewer: /src/components/games/HulkOpenWorld3D/tools/viewer.html?what=hero&mode=idle&t=0.2&yaw=0.4
      import * as THREE from "three";
      import { createHeroModel } from "../render/heroModel.js";
      import { createHuman, createRobot, createAPC, createTurret, createBoss } from "../render/actors.js";
      import { RoomEnvironment } from "three/examples/jsm/environments/RoomEnvironment.js";
      const q = new URLSearchParams(location.search);
      const W = innerWidth, H = innerHeight;
      const r = new THREE.WebGLRenderer({ antialias: true });
      r.setSize(W, H);
      r.outputColorSpace = THREE.SRGBColorSpace;
      r.toneMapping = THREE.ACESFilmicToneMapping;
      r.shadowMap.enabled = true;
      document.body.appendChild(r.domElement);
      const scene = new THREE.Scene();
      scene.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture;
      scene.environmentIntensity = 0.45;
      scene.background = new THREE.Color("#7f9bb5");
      scene.add(new THREE.HemisphereLight("#cfe3ff", "#3a3226", 1.1));
      const sun = new THREE.DirectionalLight("#fff1dc", 2.4);
      sun.position.set(6, 10, 7);
      sun.castShadow = true;
      sun.shadow.mapSize.set(2048, 2048);
      sun.shadow.camera.left = -4; sun.shadow.camera.right = 4; sun.shadow.camera.top = 5; sun.shadow.camera.bottom = -2;
      scene.add(sun);
      const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: "#6d6a66", roughness: 0.9 }));
      ground.rotation.x = -Math.PI / 2;
      ground.receiveShadow = true;
      scene.add(ground);
      const cam = new THREE.PerspectiveCamera(35, W / H, 0.1, 100);
      const what = q.get("what") || "hero";
      let model, obj;
      const mode = q.get("mode") || "idle";
      const t = Number(q.get("t") || 0);
      const speed = Number(q.get("speed") || 0);
      if (what === "hero") {
        model = createHeroModel({ shadows: true });
        scene.add(model.group);
        const kinds = { punch: "jab1", punchL: "jab2", uppercut: "jab3", heavy: "heavy", ragePunch: "ragePunch", smash: "smash", clap: "clap", lift: "lift", throw: "throw", hurt: "hurt", rage: "roar", land: "landing", dive: "dive" };
        const hero = { anim: { mode, charge: Number(q.get("charge") || 1), heavy: 1 }, act: kinds[mode] ? { kind: kinds[mode], t } : null, speed, grounded: !["jump", "fall", "dive"].includes(mode), vy: mode === "fall" ? -15 : 10, carry: mode.startsWith("carry") ? {} : null, raging: q.has("rage"), deadT: t };
        for (let i = 0; i < 90; i++) model.update(hero, 1 / 60, i / 60);
      } else {
        const list = what.split(",");
        list.forEach((w, k) => {
          let m;
          if (w === "soldier" || w === "heavy" || w === "civ") m = createHuman(w, 1234567 + k * 777, {});
          else if (w === "robot" || w === "heavyRobot") m = createRobot(w === "heavyRobot", {});
          else if (w === "apc") m = createAPC({});
          else if (w === "turret") m = createTurret({});
          else m = createBoss(w, {});
          m.group.position.x = (k - (list.length - 1) / 2) * Number(q.get("gap") || 2.2);
          scene.add(m.group);
          const e = { anim: { mode: q.get("mode") || "idle" }, vx: Number(q.get("speed") || 0), vz: 0, x: 0, z: 0, heading: 0, state: "idle", stT: 0, vuln: 0, stun: 0, dead: false, shield: q.has("shield"), flash: 0 };
          e.anim.kneel = 0; e.anim.pods = Number(q.get("pods") || 0); e.anim.hammer = 0; e.anim.beam = 0;
          for (let i = 0; i < 90; i++) m.update(e, 1 / 60, i / 60);
        });
      }
      const yaw = Number(q.get("yaw") || 0.5);
      const dist = Number(q.get("dist") || 9);
      const cy = Number(q.get("cy") || 1.7);
      cam.position.set(Math.sin(yaw) * dist, cy + Number(q.get("up") || 0.6), Math.cos(yaw) * dist);
      cam.lookAt(0, cy, 0);
      r.render(scene, cam);
      window.__ready = true;
    </script>
  </body>
</html>
