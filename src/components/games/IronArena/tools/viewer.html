<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Iron Arena tank viewer (dev only)</title>
    <style>
      html, body { margin: 0; height: 100%; background: #20262c; overflow: hidden; }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <script type="module">
      // DEV-ONLY tank viewer:
      //   /src/components/games/IronArena/tools/viewer.html?models=striker,titan&skin=factory&yaw=0.6&dist=14&cy=1.5&team=0
      import * as THREE from "three";
      import { RoomEnvironment } from "three/examples/jsm/environments/RoomEnvironment.js";
      import { createTankView } from "../three/tankModel.js";
      import { TANKS } from "../engine/tanks.js";
      const q = new URLSearchParams(location.search);
      const W = Number(q.get("w") || innerWidth), H = Number(q.get("h") || innerHeight);
      const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
      r.setSize(W, H);
      r.outputColorSpace = THREE.SRGBColorSpace;
      r.toneMapping = THREE.ACESFilmicToneMapping;
      r.shadowMap.enabled = true;
      r.shadowMap.type = THREE.PCFSoftShadowMap;
      document.body.appendChild(r.domElement);
      const scene = new THREE.Scene();
      scene.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture;
      scene.environmentIntensity = 0.6;
      scene.background = new THREE.Color("#7c8a96");
      scene.add(new THREE.HemisphereLight("#dfe8ff", "#5a4a3a", 0.9));
      const sun = new THREE.DirectionalLight("#fff1dc", 2.6);
      sun.position.set(8, 14, 10);
      sun.castShadow = true;
      sun.shadow.mapSize.set(2048, 2048);
      Object.assign(sun.shadow.camera, { left: -30, right: 30, top: 20, bottom: -20, far: 80 });
      scene.add(sun);
      const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({ color: "#8f8577", roughness: 0.9 }));
      ground.rotation.x = -Math.PI / 2;
      ground.receiveShadow = true;
      scene.add(ground);
      const models = (q.get("models") || TANKS.map((t) => t.id).join(",")).split(",");
      const cols = Number(q.get("cols") || 4);
      const views = [];
      models.forEach((m, i) => {
        const skinRef = q.get("team") != null ? { tank: m, team: Number(q.get("team")) } : { tank: m, id: q.get("skin") || "factory" };
        const v = createTankView(m, skinRef);
        const c = i % cols, row = Math.floor(i / cols);
        v.root.position.set((c - (Math.min(cols, models.length) - 1) / 2) * 9, 0, -row * 11);
        v.root.rotation.y = Number(q.get("yaw") || 0.7);
        v.turret.rotation.y = Number(q.get("tur") || 0);
        v.gun.rotation.x = -Number(q.get("elev") || 0.05);
        v.anim.U.uDistL.value = Number(q.get("dist") || 0);
        v.anim.U.uDistR.value = Number(q.get("dist") || 0);
        scene.add(v.root);
        views.push(v);
      });
      const cam = new THREE.PerspectiveCamera(Number(q.get("fov") || 35), W / H, 0.1, 500);
      const rows = Math.ceil(models.length / cols);
      cam.position.set(Number(q.get("cx") || 0), Number(q.get("cy") || 9 + rows * 3), Number(q.get("cz") || 18 + rows * 3));
      cam.lookAt(0, 1, -(rows - 1) * 5.5);
      r.render(scene, cam);
      window.__ready = true;
      window.__views = views;
      window.__render = () => r.render(scene, cam);
    </script>
  </body>
</html>
