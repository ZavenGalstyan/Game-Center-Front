<!doctype html>
<!-- DEV-only character lineup: /src/components/games/KungFuPanda/tools/chars.html?anim=idle&p=0.5&view=front -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; height: 100%; background: #9cc8e8; overflow: hidden; font: 12px sans-serif; }
      #labels span { position: absolute; bottom: 8px; transform: translateX(-50%); background: #0008; color: #fff; padding: 2px 6px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <div id="labels"></div>
    <script type="module">
      import * as THREE from "three";
      import { buildCharacter, poseCharacter, buildDummy } from "../render/characters.js";
      const q = new URLSearchParams(location.search);
      const anim = q.get("anim") || "idle";
      const p = parseFloat(q.get("p") || "0.5");
      const view = q.get("view") || "front";
      const ids = (q.get("ids") || "po,tigress,monkey,crane,mantis,viper,tailung,wolf,shifu").split(",");
      const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(1);
      document.body.appendChild(renderer.domElement);
      const scene = new THREE.Scene();
      scene.background = new THREE.Color("#9cc8e8");
      scene.add(new THREE.HemisphereLight("#ffffff", "#6a7a4a", 1.4));
      const sun = new THREE.DirectionalLight("#fff4e0", 2.2);
      sun.position.set(3, 6, 5);
      scene.add(sun);
      const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 10), new THREE.MeshLambertMaterial({ color: "#7aa25a" }));
      ground.rotation.x = -Math.PI / 2;
      scene.add(ground);
      const grid = new THREE.GridHelper(40, 40, "#335", "#557");
      grid.position.y = 0.002;
      scene.add(grid);
      const gap = 1.7;
      const rigs = ids.map((id, i) => {
        const R = id === "dummy" ? null : buildCharacter(id, i);
        const x = (i - (ids.length - 1) / 2) * gap;
        if (R) {
          R.root.position.x = x;
          R.root.rotation.y = view === "side" ? Math.PI / 2 : view === "back" ? Math.PI : view === "three" ? 0.6 : 0;
          scene.add(R.root);
        } else {
          const d = buildDummy();
          d.root.position.x = x;
          scene.add(d.root);
        }
        return R;
      });
      const cam = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 100);
      const W = ids.length * gap;
      const zoom = parseFloat(q.get("zoom") || "1");
      cam.position.set(0, 1.25, (W * 1.05 + 2) / zoom);
      cam.lookAt(0, 0.9, 0);
      // pose: step the animation to progress p
      const spec = { po: "belly", tigress: "dash", monkey: "whirl", crane: "gust", mantis: "pressure", viper: "ribbon" };
      for (let k = 0; k < 90; k++)
        rigs.forEach((R, i) => R && poseCharacter(R, { anim, p, t: k / 60, speed: anim === "move" ? 6 : 0, maxSpeed: 6, grounded: anim !== "air", special: spec[ids[i]], combo: 1 }, 1 / 60));
      renderer.render(scene, cam);
      const lab = document.getElementById("labels");
      ids.forEach((id, i) => {
        const v = new THREE.Vector3((i - (ids.length - 1) / 2) * gap, 0, 0).project(cam);
        const s = document.createElement("span");
        s.textContent = id + (rigs[i] ? ` ${rigs[i].H.toFixed(2)}m` : "");
        s.style.left = ((v.x + 1) / 2) * innerWidth + "px";
        lab.appendChild(s);
      });
      window.__done = true;
    </script>
  </body>
</html>
